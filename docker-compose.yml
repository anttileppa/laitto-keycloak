services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command:
      - start-dev
      - --spi-theme-static-max-age=-1
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
    environment:
      # Renamed in Keycloak 26.0; the old KEYCLOAK_ADMIN* pair still works but warns on every boot.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    volumes:
      # Mount theme for hot-reload during development (no rebuild needed)
      - ./themes:/opt/keycloak/themes

  # Applies realm-config/laitto.yaml, exactly as production does via the Helm chart's config job.
  # Local dev used to boot from a separate laitto-realm.json through `--import-realm`, which meant
  # two hand-maintained copies of the realm in two formats — and they drifted. One file, one format.
  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/laitto.yaml
    volumes:
      - ./realm-config:/config:ro

  # Catches every outgoing mail so account verification and password reset work locally with no
  # real SMTP credentials. Read them at http://localhost:8025 — nothing leaves the machine.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
