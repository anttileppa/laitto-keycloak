realm: laitto
enabled: true
displayName: Laitto
loginTheme: laitto
organizationsEnabled: true
# ── Languages ──────────────────────────────────────────────────────────────────
# The login and register pages are the one leg of the sign-up journey the site itself cannot paint,
# so they speak the same languages as the app (laitto#189). laitto-ui hands the visitor's chosen
# locale over as `ui_locales`; Keycloak honours it only when the realm declares the locale here, and
# falls back to defaultLocale otherwise. Keep this list in step with SUPPORTED_LOCALES in
# laitto-ui/src/atoms/locale.ts, and with the production copy in laitto-charts
# (charts/laitto/templates/keycloak-config-configmap.yaml).
#
# Keycloak ships its own Finnish translations for the stock login screens; the theme's
# messages_fi.properties only carries the strings we override ourselves (breweryName, doRegister, …).
internationalizationEnabled: true
supportedLocales:
  - en
  - fi
defaultLocale: en
resetPasswordAllowed: true
rememberMe: true
registrationAllowed: true
# Local dev only: the compose stack is plain HTTP on localhost, and Keycloak's default
# (sslRequired: external) answers "HTTPS required" to every login and register page. Production
# deliberately leaves this at the default — it sits behind HTTPS.
sslRequired: none
# Session lifetimes are sized for a brew day, not an office app (laitto#151). A brewer puts the
# phone down for a whole mash rest, so Keycloak's default 30-minute idle timeout expired the SSO
# session mid-brew and took the refresh token with it. Keep in step with the production copy in
# laitto-charts (charts/laitto/templates/keycloak-config-configmap.yaml) — the two have drifted
# before; this file is the local docker-compose realm, that one is what production applies.
accessTokenLifespan: 300
ssoSessionIdleTimeout: 43200   # 12 h
ssoSessionMaxLifespan: 86400   # 24 h

# ── Email ──────────────────────────────────────────────────────────────────────
# Local dev sends to Mailpit (docker-compose), so account verification and password reset work
# without real credentials and without anything leaving the machine — read the mail at
# http://localhost:8025. Production points at OCI Email Delivery instead; see the chart's
# keycloak-config-configmap.yaml.
verifyEmail: true
smtpServer:
  host: mailpit
  port: "1025"
  from: noreply@send.laitto.eu
  fromDisplayName: Laitto
  replyTo: info@laitto.eu
  replyToDisplayName: Laitto
  envelopeFrom: noreply@send.laitto.eu
  auth: "false"
  ssl: "false"
  starttls: "false"

# Local test account. Registration uses email as username, so this one does too.
users:
  - username: brewer@laitto.local
    email: brewer@laitto.local
    firstName: Test Brewer
    enabled: true
    emailVerified: true
    credentials:
      - type: password
        value: brewer
        temporary: false

# ── Registration form ──────────────────────────────────────────────────────────
# The brewery is named on the register page itself, so signing up and creating the brewery are one
# action rather than two forms. `breweryName` is a declarative user-profile attribute: any attribute
# a *user* may edit is rendered on the registration form, and the order here is the render order —
# hence breweryName first.
#
# It is deliberately NOT `required`. Do not add a required stanza back: Keycloak's built-in
# VERIFY_PROFILE required action fires at *every* login while the declarative profile is
# incomplete, so a required breweryName bounces into "Update Account Information" every account
# that has no value — which is both every account predating this feature *and* every account the
# backend has successfully onboarded, since clearBreweryNameAttribute wipes the value once the
# brewery exists. The attribute is a one-shot handoff to the app, not a property of the user.
# Leaving it blank is a supported path: laitto-ui's BreweryGate falls through to its onboarding
# form when the brewery_name claim is absent.
#
# Labels resolve from the theme's messages_en.properties (breweryName / breweryNameHelp), so the
# copy lives with the theme instead of being duplicated here.
#
# lastName is admin-edit-only on purpose: that drops it off the register form, and the single
# "Your name" field (firstName) carries the whole name. laitto-ui's member label already falls back
# to firstName alone, so nothing downstream breaks.
registrationEmailAsUsername: true   # email is the username — one less thing to invent and remember

components:
  org.keycloak.userprofile.UserProfileProvider:
    - providerId: declarative-user-profile
      config:
        kc.user.profile.config:
          - |
              {
                "attributes": [
                  {
                    "name": "breweryName",
                    "displayName": "${breweryName}",
                    "selector": {
                      "scopes": [
                        "brewery-signup"
                      ]
                    },
                    "validations": {
                      "length": {
                        "min": 2,
                        "max": 80
                      }
                    },
                    "permissions": {
                      "view": [
                        "admin",
                        "user"
                      ],
                      "edit": [
                        "admin",
                        "user"
                      ]
                    },
                    "annotations": {
                      "inputType": "text",
                      "inputHelperTextAfter": "${breweryNameHelp}"
                    },
                    "multivalued": false
                  },
                  {
                    "name": "username",
                    "displayName": "${username}",
                    "validations": {
                      "length": {
                        "min": 3,
                        "max": 255
                      },
                      "username-prohibited-characters": {},
                      "up-username-not-idn-homograph": {}
                    },
                    "permissions": {
                      "view": [
                        "admin",
                        "user"
                      ],
                      "edit": [
                        "admin",
                        "user"
                      ]
                    },
                    "multivalued": false
                  },
                  {
                    "name": "email",
                    "displayName": "${email}",
                    "validations": {
                      "email": {},
                      "length": {
                        "max": 255
                      }
                    },
                    "required": {
                      "roles": [
                        "user"
                      ]
                    },
                    "permissions": {
                      "view": [
                        "admin",
                        "user"
                      ],
                      "edit": [
                        "admin",
                        "user"
                      ]
                    },
                    "multivalued": false
                  },
                  {
                    "name": "firstName",
                    "displayName": "${firstName}",
                    "validations": {
                      "length": {
                        "max": 255
                      },
                      "person-name-prohibited-characters": {}
                    },
                    "required": {
                      "roles": [
                        "user"
                      ]
                    },
                    "permissions": {
                      "view": [
                        "admin",
                        "user"
                      ],
                      "edit": [
                        "admin",
                        "user"
                      ]
                    },
                    "multivalued": false
                  },
                  {
                    "name": "lastName",
                    "displayName": "${lastName}",
                    "validations": {
                      "length": {
                        "max": 255
                      },
                      "person-name-prohibited-characters": {}
                    },
                    "permissions": {
                      "view": [
                        "admin",
                        "user"
                      ],
                      "edit": [
                        "admin"
                      ]
                    },
                    "multivalued": false
                  }
                ],
                "groups": [
                  {
                    "name": "user-metadata",
                    "displayHeader": "User metadata",
                    "displayDescription": "Attributes, which refer to user metadata"
                  }
                ]
              }

# ── Client scopes ──────────────────────────────────────────────────────────────
# `brewery-signup` gates the breweryName field on the register page (laitto#184). Only the
# founder sign-up link requests it, so an invited brewer's register page genuinely does not
# carry the field — they are joining a brewery, not naming one.
#
# It MUST stay OPTIONAL and be requested explicitly. Keycloak's selector.scopes matches only
# scopes present in the `scope` request parameter: making this a *default* client scope does
# not satisfy the selector, and the field then disappears from founder sign-up too. Verified
# against 26.7.2.
#
# Ordering with the frontends matters and is not symmetric. Requesting a scope the realm does
# not declare fails the whole authorization request — Keycloak redirects back with
# `error=invalid_scope` and nobody can sign in. This file must therefore land BEFORE laitto-ui
# and laitto-mobile start asking for it. The reverse order only degrades the register page.
# Platform-admin role (laitto#210). The first role in the realm: it gates the write side of
# /v1/system/appVersions, so the mobile version floor can be raised without a deploy.
#
# This is Laitto staff, at the realm level — a different axis from what a member may do inside
# their own brewery (laitto#186). Assigned by hand; nothing self-serves it.
#
# Unlike a client's optionalClientScopes, declaring roles here is additive: verified on a fresh
# 26.7.2 realm that an import naming only laitto-admin leaves default-roles-laitto (composite),
# offline_access and uma_authorization in place, with the realm's defaultRole still pointing at
# the composite. So Keycloak's built-ins are deliberately NOT spelled out below — unlike the
# client scope lists, where omitting them is an outage.
roles:
  realm:
    - name: laitto-admin
      description: Laitto platform administrator. Grants access to platform-wide settings such as the mobile app version floor.

clientScopes:
  - name: brewery-signup
    description: Requested by the founder sign-up link so the brewery-name field is rendered.
    protocol: openid-connect
    attributes:
      include.in.token.scope: "false"
      display.on.consent.screen: "false"

clients:
  - clientId: laitto-management
    name: Laitto UI
    # keycloak-config-cli REPLACES this list rather than appending to it, so Keycloak's own
    # defaults must be spelled out. Listing only brewery-signup silently drops `organization` —
    # which the app requests on every login, and which carries the claim BreweryResolver reads.
    # The result is `invalid_scope` on sign-in for everyone. Verified against a fresh 26.7.2 realm.
    optionalClientScopes:
      - address
      - microprofile-jwt
      - offline_access
      - organization
      - phone
      - brewery-signup
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - "http://localhost:5173/*"
      - "http://localhost:4173/*"
    webOrigins:
      - "http://localhost:5173"
      - "http://localhost:4173"
    attributes:
      post.logout.redirect.uris: "http://localhost:5173/*##http://localhost:4173/*"

    protocolMappers:
      # Carries the brewery name typed on the register page into the token, so the app can create
      # the brewery on first sign-in without asking for it a second time. Cleared from the user by
      # the backend once the brewery exists, so it cannot resurrect a phantom brewery later.
      - name: brewery-name
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          user.attribute: breweryName
          claim.name: brewery_name
          jsonType.label: String
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
  - clientId: laitto-mobile
    name: Laitto Mobile
    # keycloak-config-cli REPLACES this list rather than appending to it, so Keycloak's own
    # defaults must be spelled out. Listing only brewery-signup silently drops `organization` —
    # which the app requests on every login, and which carries the claim BreweryResolver reads.
    # The result is `invalid_scope` on sign-in for everyone. Verified against a fresh 26.7.2 realm.
    optionalClientScopes:
      - address
      - microprofile-jwt
      - offline_access
      - organization
      - phone
      - brewery-signup
    description: Laitto mobile app (expo-auth-session, OIDC auth-code + PKCE over the fi.laitto.mobile:// app scheme)
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - "fi.laitto.mobile://*"
    attributes:
      pkce.code.challenge.method: "S256"
      post.logout.redirect.uris: "fi.laitto.mobile://*"

    protocolMappers:
      # Carries the brewery name typed on the register page into the token, so the app can create
      # the brewery on first sign-in without asking for it a second time. Cleared from the user by
      # the backend once the brewery exists, so it cannot resurrect a phantom brewery later.
      - name: brewery-name
        protocol: openid-connect
        protocolMapper: oidc-usermodel-attribute-mapper
        consentRequired: false
        config:
          user.attribute: breweryName
          claim.name: brewery_name
          jsonType.label: String
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
  - clientId: laitto-services
    name: Laitto Backend Services
    enabled: true
    publicClient: false
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    secret: "change-me-backend-secret"
