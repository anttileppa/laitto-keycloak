realm: laitto
enabled: true
displayName: Laitto
loginTheme: laitto
organizationsEnabled: true
resetPasswordAllowed: true
rememberMe: true
registrationAllowed: true
accessTokenLifespan: 300
ssoSessionMaxLifespan: 36000

clients:
  - clientId: laitto-management
    name: Laitto UI
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - "http://localhost:5173/*"
      - "http://localhost:4173/*"
    webOrigins:
      - "http://localhost:5173"
      - "http://localhost:4173"
    attributes:
      post.logout.redirect.uris: "http://localhost:5173/*##http://localhost:4173/*"

  - clientId: laitto-mobile
    name: Laitto Mobile
    description: Laitto mobile app (expo-auth-session, OIDC auth-code + PKCE over the fi.laitto.mobile:// app scheme)
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - "fi.laitto.mobile://*"
    attributes:
      pkce.code.challenge.method: "S256"
      post.logout.redirect.uris: "fi.laitto.mobile://*"

  - clientId: laitto-services
    name: Laitto Backend Services
    enabled: true
    publicClient: false
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    secret: "change-me-backend-secret"

  # Headless logins for the stress rig's throwaway users (#106): the k6 setup/teardown scripts
  # authenticate with the password grant — no browser flow. Confidential so the grant needs the
  # secret on top of the user password; disabled flows keep it single-purpose.
  - clientId: laitto-stress
    name: Laitto Stress Rig
    description: Direct-grant client for the self-cleaning stress tests (laitto#106)
    enabled: true
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    serviceAccountsEnabled: false
    secret: "change-me-stress-secret"
