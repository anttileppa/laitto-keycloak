realm: laitto
enabled: true
displayName: Laitto
loginTheme: laitto
organizationsEnabled: true
resetPasswordAllowed: true
rememberMe: true
registrationAllowed: true
# Session lifetimes are sized for a brew day, not an office app (laitto#151). A brewer puts the
# phone down for a whole mash rest, so Keycloak's default 30-minute idle timeout expired the SSO
# session mid-brew and took the refresh token with it. Keep in step with the production copy in
# laitto-charts (charts/laitto/templates/keycloak-config-configmap.yaml) — the two have drifted
# before; this file is the local docker-compose realm, that one is what production applies.
accessTokenLifespan: 300
ssoSessionIdleTimeout: 43200   # 12 h
ssoSessionMaxLifespan: 86400   # 24 h

clients:
  - clientId: laitto-management
    name: Laitto UI
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - "http://localhost:5173/*"
      - "http://localhost:4173/*"
    webOrigins:
      - "http://localhost:5173"
      - "http://localhost:4173"
    attributes:
      post.logout.redirect.uris: "http://localhost:5173/*##http://localhost:4173/*"

  - clientId: laitto-mobile
    name: Laitto Mobile
    description: Laitto mobile app (expo-auth-session, OIDC auth-code + PKCE over the fi.laitto.mobile:// app scheme)
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - "fi.laitto.mobile://*"
    attributes:
      pkce.code.challenge.method: "S256"
      post.logout.redirect.uris: "fi.laitto.mobile://*"

  - clientId: laitto-services
    name: Laitto Backend Services
    enabled: true
    publicClient: false
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    secret: "change-me-backend-secret"
