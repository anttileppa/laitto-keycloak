# Finnish login copy (laitto#189). Only the strings this theme overrides itself live here —
# Keycloak's own Finnish bundle covers the stock screens, and anything missing from this file falls
# back to it rather than to English.
#
# The realm must list `fi` in supportedLocales (realm-config/laitto.yaml) or Keycloak never reaches
# this file, whatever `ui_locales` laitto-ui asks for.
loginTitle=Laitto
loginTitleHtml=<strong>Laitto</strong>

# Field labels
email=Sähköposti
password=Salasana
rememberMe=Muista minut tällä laitteella
doLogIn=Kirjaudu sisään
doRegister=Luo panimo
doForgotPassword=Unohditko salasanan?
noAccount=Eikö sinulla ole vielä tiliä?

# Errors
invalidUserMessage=Virheellinen sähköposti tai salasana.
accountDisabledMessage=Tilisi on poistettu käytöstä.
accountTemporarilyDisabledMessage=Liian monta epäonnistunutta yritystä. Yritä myöhemmin uudelleen.

# Registration
registerTitle=Luo panimosi
firstName=Nimesi
lastName=Sukunimi
doSubmit=Luo panimo
backToLogin=Takaisin kirjautumiseen

# breweryName is a declarative user-profile attribute (see realm-config/laitto.yaml).
breweryName=Panimon nimi
breweryNameHelp=Panimosi pitää sisällään laitteistosi, reseptisi ja panosessiot. Voit nimetä sen myöhemmin uudelleen.
