name: Build and push Keycloak image

# Runs on a *release tag*, not on every merge to main. Keycloak is part of the `web` release
# channel (backend + ui + keycloak), cut together — see docs/release-process.md in the umbrella
# repo. Merging no longer deploys anything (laitto#204); the release tool updates
# laitto-charts/release.yaml and that push is what deploys.
on:
  push:
    tags:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    environment: main
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed to prove the tag is on main, below.
          fetch-depth: 0

      - name: Refuse to publish a tag that is not on main
        # A tag can point anywhere, and this image goes to production.
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not an ancestor of main — refusing to publish."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The release tag is the image tag — the named artifact a rollback targets. `latest`
          # and `main` are gone: nothing publishes them now, and a stale floating tag is how you
          # deploy last month's build by accident.
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

